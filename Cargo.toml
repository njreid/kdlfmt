[workspace]
resolver = "3"
members = ["cli"]
exclude = []

[workspace.package]
version = "0.1.6-b"
authors = ["Mads Hougesen <mads@mhouge.dk>"]
edition = "2024"
description = "A code formatter for kdl documents."
documentation = "https://github.com/hougesen/kdlfmt#readme"
readme = "README.md"
homepage = "https://github.com/hougesen/kdlfmt?tab=readme-ov-file"
repository = "https://github.com/hougesen/kdlfmt"
license = "MIT"
keywords = ["code-formatter", "formatter", "kdl", "pretty-printing"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
assert_cmd = "2.2.0"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
clap_complete_nushell = "4.6.0"
console = "0.16.2"
dashmap = "6.1.0"
ec4rs = "1.2.0"
env_logger = "0.11.9"
ignore = "0.4.25"
kdl = { git = "https://github.com/njreid/kdl-rs", rev = "05521dce0f3d2915f3fa6707f240c938dde3b818", features = ["v1", "expression-strings"] }
log = "0.4.29"
miette = { version = "7.6.0", features = ["fancy"] }
predicates = "3.1.4"
rayon = "1.10.0"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
